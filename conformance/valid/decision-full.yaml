# SPEC 3.3 -- every optional field at once. Catches schemas that forbid
# combinations the specification permits.
id: DL-9005
title: Split the tenancy service from the billing monolith
status: accepted
date_decided: 2026-01-15
review_by: 2027-01-15
deciders: [head-of-platform, principal-engineer]

scope:
  services: [tenancy-service, billing]
  repositories: [platform/tenancy, platform/billing]
  teams: [platform]
  environments: [production, staging]

context: >
  Billing release cadence was gating tenancy changes that carry no billing
  risk, and the two domains had diverged in their consistency requirements.

decision: >
  Extract tenancy into its own service with an asynchronous interface to
  billing. Billing remains the system of record for money.

options:
  - name: Extract tenancy into its own service
    chosen: true
  - name: Keep the monolith and split release trains
    rejected_because: >
      Release trains do not decouple the schema, which is where the actual
      coupling lives.
  - name: Extract billing instead
    rejected_because: >
      Billing carries the regulatory surface; moving it first maximises risk
      for the same architectural benefit.

consequences:
  positive:
    - Tenancy releases no longer wait on billing.
    - Failure domains separate.
  negative:
    - Cross-domain reporting now requires joining across two stores.
    - An asynchronous boundary introduces eventual consistency the UI must show.

