name: validate

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate examples and decisions
        run: python3 tools/validate.py

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: The reference implementation must be conformant
        run: python3 tools/conformance.py

  playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Question ids must keep meaning the same thing
        run: python3 tools/playbook_lock.py --check

  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Import the sample ADRs
        run: python3 tools/adr_import.py examples/adr-samples --out "$RUNNER_TEMP/imported"
      - name: Every imported record must validate
        run: python3 tools/validate.py "$RUNNER_TEMP"/imported/*.yaml
